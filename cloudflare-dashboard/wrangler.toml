name = "logistik-dashboard"
compatibility_date = "2026-07-16"

# Rein statische Seite — keine serverseitige Logik, kein KV, keine Secrets. Alles, was das
# Dashboard braucht, kommt aus direkten Aufrufen der engine-api im Browser
# (siehe public/app.js, API_BASE_URL). Als Workers-Static-Assets-Projekt angelegt
# (statt Cloudflare Pages), aus Konsistenz mit cloudflare-worker/ und weil Cloudflare
# neue statische Deployments in Richtung Workers lenkt.
[assets]
directory = "./public/"
