name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # ruff fest gepinnt: der Standard-Regelsatz ändert sich zwischen Releases (siehe engine-api/ruff.toml)
      - run: pip install -r requirements.txt pytest ruff==0.17.4
      - run: pytest -q
      - run: ruff check .
