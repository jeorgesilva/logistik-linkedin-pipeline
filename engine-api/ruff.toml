# Ruff config for engine-api. Runtime is Python 3.11 (Dockerfile + CI).
target-version = "py311"

[lint.per-file-ignores]
# BLE001 (blind except) is an intentional design choice in these modules, not debt.
# Every catch-all here wraps an external, unreliable boundary (Ollama/LLM calls,
# RSS feeds, HTTP scraping, ChromaDB, Pollinations, LinkedIn, Cloudflare Worker,
# cloudflared metrics) and always logs + returns a fallback. One malformed article
# or flaky source must never take down the whole pipeline run or background loop.
# Any module NOT listed here (main.py, db.py, ...) still gets BLE001 enforced.
"agents.py" = ["BLE001"]          # LLM calls: retry loop, then fallback value
"extract.py" = ["BLE001"]         # trafilatura / crawl4ai on arbitrary web pages
"images.py" = ["BLE001"]          # Pollinations.ai with backoff
"kb.py" = ["BLE001"]              # ChromaDB/embeddings: pipeline continues without RAG
"linkedin.py" = ["BLE001"]        # per-post publish failure must not abort the batch
"pipeline.py" = ["BLE001"]        # per-article isolation inside the batch
"queue_poller.py" = ["BLE001"]    # background loop polling the Cloudflare Worker
"rank.py" = ["BLE001"]            # TF-IDF fallback to unranked top-N
"rss.py" = ["BLE001"]             # per-feed isolation: one dead feed != no articles
"tunnel_reporter.py" = ["BLE001"] # background loop reporting the tunnel URL
"scripts/debug/*.py" = ["BLE001"] # manual debug scripts, not part of the service
