networks:
  pipeline_net:
    driver: bridge

volumes:
  ollama_models:
  n8n_data:
  chroma_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [pipeline_net]
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: ollama-model-init
    networks: [pipeline_net]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "nomic-embed-text"]
    restart: "no"

  engine-api:
    build: ./engine-api
    container_name: engine-api
    networks: [pipeline_net]
    volumes:
      - ./engine-api:/app
      - ./data:/data
      - chroma_data:/data/chroma
    env_file: .env
    ports:
      # Bound to localhost only — public access goes through the cloudflared
      # tunnel below, not through a directly exposed port. Keeping this bound
      # to 127.0.0.1 (instead of removing it) preserves SSH-tunnel/debug access
      # from the VPS itself without exposing the port to 0.0.0.0.
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  review-ui:
    build: ./review-ui
    container_name: review-ui
    networks: [pipeline_net]
    volumes:
      - ./data:/data
    environment:
      - ENGINE_API_URL=http://engine-api:8000
    ports:
      # Same rationale as engine-api above: localhost-only, public access via cloudflared.
      - "127.0.0.1:8503:8501"
    depends_on:
      engine-api:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    networks: [pipeline_net]
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      # Same rationale as engine-api above: localhost-only, public access via cloudflared.
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change-me}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.YOUR-DOMAIN.example}
    depends_on:
      engine-api:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    networks: [pipeline_net]
    # Quick Tunnel mode: no Cloudflare zone/domain needed, free. Cloudflare
    # assigns a random https://*.trycloudflare.com hostname on every start and
    # prints it to this container's logs (`docker logs cloudflared`) — it is
    # NOT stable across restarts. Only exposes engine-api (what the
    # cloudflare-dashboard needs); review-ui/n8n stay localhost-only.
    # Superseded the previous named/token tunnel (CLOUDFLARE_TUNNEL_TOKEN in
    # .env is no longer read by this command, left in place unused).
    # --protocol http2: QUIC (the default) fails to hold a stable control
    # stream over Colima's network on this machine (constant "control stream
    # encountered a failure" / QUIC handshake timeouts in `docker logs
    # cloudflared`). HTTP/2 is TCP-based and works reliably here instead.
    command: tunnel --protocol http2 --url http://engine-api:8000
    depends_on:
      engine-api:
        condition: service_healthy
    restart: unless-stopped
