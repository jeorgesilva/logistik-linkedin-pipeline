networks:
  pipeline_net:
    driver: bridge

volumes:
  ollama_models:
  n8n_data:
  chroma_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [pipeline_net]
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: ollama-model-init
    networks: [pipeline_net]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "nomic-embed-text"]
    restart: "no"

  engine-api:
    build: ./engine-api
    container_name: engine-api
    networks: [pipeline_net]
    volumes:
      - ./engine-api:/app
      - ./data:/data
      - chroma_data:/data/chroma
    env_file: .env
    ports:
      # Nur an localhost gebunden — öffentlicher Zugriff läuft über den
      # cloudflared-Tunnel unten, nicht über einen direkt freigegebenen Port. Die
      # Bindung an 127.0.0.1 (statt den Port ganz zu entfernen) erhält den
      # SSH-Tunnel-/Debug-Zugriff vom VPS selbst, ohne den Port auf 0.0.0.0 zu öffnen.
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  review-ui:
    build: ./review-ui
    container_name: review-ui
    networks: [pipeline_net]
    volumes:
      - ./data:/data
    environment:
      - ENGINE_API_URL=http://engine-api:8000
    ports:
      # Gleiche Begründung wie bei engine-api oben: nur localhost, öffentlicher Zugriff über cloudflared.
      - "127.0.0.1:8503:8501"
    depends_on:
      engine-api:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    networks: [pipeline_net]
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      # Gleiche Begründung wie bei engine-api oben: nur localhost, öffentlicher Zugriff über cloudflared.
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Berlin}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change-me}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.YOUR-DOMAIN.example}
    depends_on:
      engine-api:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    networks: [pipeline_net]
    # Quick-Tunnel-Modus: keine Cloudflare-Zone/-Domain nötig, kostenlos. Cloudflare
    # vergibt bei jedem Start einen zufälligen https://*.trycloudflare.com-Hostnamen
    # und gibt ihn in den Logs dieses Containers aus (`docker logs cloudflared`) — er
    # ist über Neustarts hinweg NICHT stabil. Gibt nur engine-api frei (was das
    # cloudflare-dashboard braucht); review-ui/n8n bleiben nur auf localhost.
    # Ersetzt den früheren benannten Tunnel per Token (CLOUDFLARE_TUNNEL_TOKEN in
    # .env wird von diesem Befehl nicht mehr gelesen, bleibt ungenutzt stehen).
    # --protocol http2: QUIC (der Standard) hält über das Colima-Netzwerk auf diesem
    # Rechner keinen stabilen Control-Stream (ständig "control stream encountered a
    # failure" / QUIC-Handshake-Timeouts in `docker logs cloudflared`). HTTP/2 läuft
    # über TCP und funktioniert hier stattdessen zuverlässig.
    command: tunnel --protocol http2 --url http://engine-api:8000
    depends_on:
      engine-api:
        condition: service_healthy
    restart: unless-stopped
