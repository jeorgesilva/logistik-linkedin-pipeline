<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logistik LinkedIn — Posts generieren</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 480px;
    margin: 80px auto;
    text-align: center;
    color: #1f2933;
    padding: 0 20px;
  }
  button {
    font-size: 1.1rem;
    padding: 14px 28px;
    border-radius: 8px;
    border: none;
    background: #0a66c2;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #9fb3c8; cursor: not-allowed; }
  #status {
    margin-top: 24px;
    font-size: 0.95rem;
    color: #52606d;
    white-space: pre-line;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>📦 Tagesposts generieren</h1>
  <p>Klicke, um eine neue Runde Posts anzufordern. Wenn der Computer, auf dem
  das System läuft, ausgeschaltet ist, wird die Anfrage hier gespeichert und
  automatisch verarbeitet, sobald er wieder online ist.</p>
  <button id="btn">🚀 Posts generieren</button>
  <div id="status"></div>

<script>
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");

function fmt(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("de-DE");
}

function render(data) {
  if (!data || data.status === "idle") {
    statusEl.textContent = "";
    btn.disabled = false;
  } else if (data.status === "pending") {
    statusEl.textContent =
      "⏳ Anfrage registriert am " + fmt(data.requested_at) +
      ".\nWartet darauf, dass das System online geht, um verarbeitet zu werden.";
    btn.disabled = true;
  } else if (data.status === "processing") {
    statusEl.textContent = "⚙️ Wird gerade verarbeitet — das kann einige Minuten dauern...";
    btn.disabled = true;
  } else if (data.status === "done") {
    statusEl.textContent =
      "✅ Fertig! " + (data.result_summary || "") +
      "\nÖffne die Freigabe-Warteschlange, um die Posts zu sehen.";
    btn.disabled = false;
  } else if (data.status === "error") {
    statusEl.textContent =
      "⚠️ Beim letzten Versuch ist etwas schiefgelaufen: " + (data.result_summary || "") +
      "\nDu kannst es erneut versuchen.";
    btn.disabled = false;
  }
}

async function refreshStatus() {
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    render(data);
  } catch (e) {
    // Worker itself unreachable (rare) — leave button usable, just don't update status.
  }
}

btn.addEventListener("click", async () => {
  btn.disabled = true;
  statusEl.textContent = "Anfrage wird gesendet...";
  try {
    const res = await fetch("/api/request", { method: "POST" });
    const data = await res.json();
    render(data);
  } catch (e) {
    statusEl.textContent = "⚠️ Anfrage konnte nicht gesendet werden. Bitte erneut versuchen.";
    btn.disabled = false;
  }
});

refreshStatus();
setInterval(refreshStatus, 8000);
</script>
</body>
</html>
